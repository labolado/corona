name: bgfx Build Verification

on:
  push:
    branches:
      - bgfx-solar2d
      - 'feature/**'
  pull_request:
    branches:
      - bgfx-solar2d
  workflow_dispatch:
  workflow_call:

env:
  WORKSPACE: ${{ github.workspace }}
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build-bgfx-libs:
    name: Build bgfx static libraries
    runs-on: macos-26
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compute prebuilt release tag
        id: tag
        run: |
          BGFX_SHA=$(git -C external/bgfx  rev-parse --short=8 HEAD)
          BX_SHA=$(git   -C external/bx    rev-parse --short=8 HEAD)
          BIMG_SHA=$(git -C external/bimg  rev-parse --short=8 HEAD)
          TAG="solar2d-${BGFX_SHA}-${BX_SHA}-${BIMG_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Prebuilt tag: $TAG"
      - name: Try download prebuilt libs
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DL=$(mktemp -d)
          if gh release download "$TAG" --repo labolado/bgfx --dir "$DL" 2>/dev/null; then
            echo "Prebuilt found: $TAG"
            mkdir -p external/bgfx/.build/projects/xcode15
            tar -xzf "$DL/bgfx-macos.tar.gz"         -C external/bgfx/.build/projects/xcode15
            mkdir -p external/bgfx/.build/ios-arm64/bin
            tar -xzf "$DL/bgfx-ios-device.tar.gz"    -C external/bgfx/.build/ios-arm64/bin
            mkdir -p external/bgfx/.build/ios-simulator/bin
            tar -xzf "$DL/bgfx-ios-simulator.tar.gz" -C external/bgfx/.build/ios-simulator/bin
            mkdir -p external/bgfx/.build/android-arm64/bin
            if [ -f "$DL/bgfx-android.tar.gz" ]; then
              tar -xzf "$DL/bgfx-android.tar.gz" -C external/bgfx/.build/android-arm64/bin
            else
              echo "::warning::bgfx-android.tar.gz missing in release $TAG — Android arm64 will be built from source"
            fi
            if [ -f "$DL/bgfx-tools.tar.gz" ]; then
              mkdir -p external/bgfx/tools/bin/darwin
              tar -xzf "$DL/bgfx-tools.tar.gz" -C external/bgfx/tools/bin/darwin
              chmod +x external/bgfx/tools/bin/darwin/shaderc
            fi
            echo "hit=true" >> $GITHUB_OUTPUT
          else
            echo "Prebuilt not found, will build from source"
            echo "hit=false" >> $GITHUB_OUTPUT
          fi
      - name: Generate bgfx projects (macOS arm64 + iOS device + iOS simulator + Android arm64)
        if: steps.prebuilt.outputs.hit != 'true' || hashFiles('external/bgfx/.build/android-arm64/bin/libbgfxRelease.a') == ''
        working-directory: ./external/bgfx
        run: |
          if [ "${{ steps.prebuilt.outputs.hit }}" != "true" ]; then
            make .build/projects/gmake-osx-arm64
            make .build/projects/gmake-ios-arm64
            make .build/projects/gmake-ios-simulator
          fi
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          make .build/projects/gmake-android-arm64
      - name: Build bgfx macOS arm64 (Debug + Release)
        if: steps.prebuilt.outputs.hit != 'true'
        working-directory: ./external/bgfx
        run: |
          make -C .build/projects/gmake-osx-arm64 config=debug   bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu)
          make -C .build/projects/gmake-osx-arm64 config=release bgfx bx bimg bimg_decode shaderc -j$(sysctl -n hw.ncpu)
      - name: Build bgfx iOS device (Debug + Release)
        if: steps.prebuilt.outputs.hit != 'true'
        working-directory: ./external/bgfx
        run: |
          SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          make -C .build/projects/gmake-ios-arm64 config=debug   bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu) CFLAGS="-isysroot $SDKROOT" CXXFLAGS="-isysroot $SDKROOT"
          make -C .build/projects/gmake-ios-arm64 config=release bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu) CFLAGS="-isysroot $SDKROOT" CXXFLAGS="-isysroot $SDKROOT"
      - name: Build bgfx iOS simulator (Release)
        if: steps.prebuilt.outputs.hit != 'true'
        working-directory: ./external/bgfx
        run: |
          SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)
          make -C .build/projects/gmake-ios-simulator config=release bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu) CFLAGS="-isysroot $SDKROOT -I../../../../bx/include/compat/ios" CXXFLAGS="-isysroot $SDKROOT -I../../../../bx/include/compat/ios"
          # Build x86_64 simulator slice (for Intel Mac simulator support).
          # -msse4.2 mirrors bx osx-x64 toolchain config (genie ios-simulator default is arm64 + NEON, no -msse* flag); needed for bx simd128_sse.inl _mm_dp_ps / _mm_round_ps
          cp -r .build/projects/gmake-ios-simulator .build/projects/gmake-ios-simulator-x86
          find .build/projects/gmake-ios-simulator-x86 -name "*.make" -exec \
            sed -i '' \
              -e 's/-arch arm64/-arch x86_64 -msse4.2/g' \
              -e 's|../../ios-simulator/|../../ios-simulator-x86/|g' \
            {} \;
          # ARCH is $(empty) in genie makefile; clang defaults to host (arm64 on AS Mac).
          # Must pass ARCH explicitly for x86_64 cross-compile.
          make -C .build/projects/gmake-ios-simulator-x86 config=release bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu) ARCH="-arch x86_64 -msse4.2" CFLAGS="-isysroot $SDKROOT -I../../../../bx/include/compat/ios" CXXFLAGS="-isysroot $SDKROOT -I../../../../bx/include/compat/ios"
          # Merge into fat binary
          if [ -d .build/ios-simulator-x86/bin ]; then
            for arm_lib in .build/ios-simulator/bin/lib*.a; do
              name=$(basename "$arm_lib")
              x86_lib=".build/ios-simulator-x86/bin/$name"
              if [ -f "$x86_lib" ]; then
                lipo -create "$arm_lib" "$x86_lib" -output "$arm_lib"
                echo "Created fat binary: $name"
              fi
            done
          fi
          # Sanity: libbgfxRelease.a must contain both arm64 and x86_64 architectures
          ARCHS=$(lipo -info .build/ios-simulator/bin/libbgfxRelease.a | sed -E 's/.*architectures? in the .*: //')
          echo "iOS simulator libbgfxRelease.a archs: $ARCHS"
          if ! echo "$ARCHS" | grep -q arm64 || ! echo "$ARCHS" | grep -q x86_64; then
            echo "ERROR: iOS simulator libbgfxRelease.a missing required architectures (need arm64+x86_64, got: $ARCHS)" >&2
            exit 1
          fi
      - name: Build bgfx Android arm64 (Release)
        if: steps.prebuilt.outputs.hit != 'true' || hashFiles('external/bgfx/.build/android-arm64/bin/libbgfxRelease.a') == ''
        working-directory: ./external/bgfx
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          make -C .build/projects/gmake-android-arm64 config=release bgfx bx bimg bimg_decode -j$(sysctl -n hw.ncpu)
      - name: Stage macOS libs in xcode15 dir
        if: steps.prebuilt.outputs.hit != 'true'
        run: |
          mkdir -p external/bgfx/.build/projects/xcode15
          cp external/bgfx/.build/osx-arm64/bin/lib*.a external/bgfx/.build/projects/xcode15/
      - name: Upload bgfx macOS libs
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-libs
          path: external/bgfx/.build/projects/xcode15/lib*.a
      - name: Upload bgfx iOS device libs
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-libs-ios-device
          path: external/bgfx/.build/ios-arm64/bin/lib*.a
      - name: Upload bgfx iOS simulator libs
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-libs-ios-simulator
          path: external/bgfx/.build/ios-simulator/bin/lib*.a
      - name: Upload bgfx Android arm64 libs
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-libs-android-arm64
          path: external/bgfx/.build/android-arm64/bin/lib*.a
      - name: Install and upload shaderc tool
        if: steps.prebuilt.outputs.hit != 'true'
        run: |
          SHADERC_BIN="external/bgfx/.build/osx-arm64/bin/shadercRelease"
          SHADERC_DEST="external/bgfx/tools/bin/darwin/shaderc"
          mkdir -p "$(dirname "$SHADERC_DEST")"
          cp "$SHADERC_BIN" "$SHADERC_DEST"
          chmod +x "$SHADERC_DEST"
          echo "shaderc: $(file "$SHADERC_DEST")"
      - name: Install prebuilt shaderc (cache hit, old release without bgfx-tools.tar.gz)
        if: steps.prebuilt.outputs.hit == 'true' && hashFiles('external/bgfx/tools/bin/darwin/shaderc') == ''
        run: echo "::warning::shaderc not in prebuilt release — shader sync check will be skipped"
      - name: Upload shaderc tool
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-tools
          path: external/bgfx/tools/bin/darwin/shaderc
      - name: Verify shader binary sync
        if: hashFiles('external/bgfx/tools/bin/darwin/shaderc') != ''
        run: bash tests/compile_shaders.sh --check
      - name: Publish prebuilt libs to labolado/bgfx
        if: steps.prebuilt.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.LABOLADO_BGFX_RELEASE_TOKEN || github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo labolado/bgfx &>/dev/null; then
            echo "Release $TAG already exists, skipping publish"
            exit 0
          fi
          find external/bgfx/.build/projects/xcode15 -name 'lib*.a' -exec strip -S {} \;
          find external/bgfx/.build/ios-arm64/bin    -name 'lib*.a' -exec strip -S {} \;
          find external/bgfx/.build/ios-simulator/bin -name 'lib*.a' -exec strip -S {} \;
          NDK_STRIP=$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name "llvm-strip" -type f 2>/dev/null | head -1)
          [ -n "$NDK_STRIP" ] && find external/bgfx/.build/android-arm64/bin -name 'lib*.a' -exec "$NDK_STRIP" -S {} \;
          ( cd "external/bgfx/.build/projects/xcode15"   && tar -czf "$OLDPWD/bgfx-macos.tar.gz"         lib*.a )
          ( cd "external/bgfx/.build/ios-arm64/bin"      && tar -czf "$OLDPWD/bgfx-ios-device.tar.gz"    lib*.a )
          ( cd "external/bgfx/.build/ios-simulator/bin"  && tar -czf "$OLDPWD/bgfx-ios-simulator.tar.gz" lib*.a )
          ( cd "external/bgfx/.build/android-arm64/bin"  && tar -czf "$OLDPWD/bgfx-android.tar.gz"       lib*.a )
          tar -czf bgfx-tools.tar.gz -C external/bgfx/tools/bin/darwin shaderc
          gh release create "$TAG" \
            --repo labolado/bgfx \
            --title "bgfx prebuilt $TAG" \
            --notes "Auto-built from ${{ github.sha }}" \
            bgfx-macos.tar.gz bgfx-ios-device.tar.gz bgfx-ios-simulator.tar.gz bgfx-android.tar.gz bgfx-tools.tar.gz
          echo "Published: $TAG"

  macOS-build:
    name: macOS ${{ matrix.config }} Build
    if: github.event_name != 'workflow_call'
    needs: build-bgfx-libs
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download bgfx libs
        uses: actions/download-artifact@v4
        with:
          name: bgfx-libs
          path: external/bgfx/.build/projects/xcode15
      - name: Patch project for CI
        run: |
          # Remove non-essential deps (CoronaCards/Console/Shell) from rttplayer
          python3 -c "
          f = 'platform/mac/ratatouille.xcodeproj/project.pbxproj'
          t = open(f).read()
          for did in ['C2B5FEEE1B336C3D00DD49E6','C26DD1131BD9514100EC4F44','C2B5FEF01B336C4200DD49E6']:
              t = t.replace('\t\t\t\t' + did + ' /* PBXTargetDependency */,\n', '')
          open(f,'w').write(t)
          "
          # Create placeholder app bundles for CopyFiles build phases
          for cfg in Debug Release; do
            for app in CoronaConsole CoronaShell; do
              mkdir -p "platform/mac/${app}/build/${cfg}/${app}.app/Contents/MacOS"
              touch "platform/mac/${app}/build/${cfg}/${app}.app/Contents/MacOS/${app}"
            done
          done
      - name: Build rttplayer (${{ matrix.config }})
        run: |
          xcodebuild -project platform/mac/ratatouille.xcodeproj \
            -target rttplayer \
            -configuration ${{ matrix.config }} \
            build \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tail -80 || true
      - name: Verify binary exists
        run: |
          test -f "platform/mac/build/${{ matrix.config }}/Corona Simulator.app/Contents/MacOS/Corona Simulator"
          echo "${{ matrix.config }} binary verified"
      - name: Create DMG
        run: |
          APP="platform/mac/build/${{ matrix.config }}/Corona Simulator.app"
          DMG="platform/mac/build/${{ matrix.config }}/Corona-Simulator-${{ matrix.config }}.dmg"
          TMP_VOL="/tmp/dmg-staging-${{ matrix.config }}"
          mkdir -p "$TMP_VOL"
          cp -r "$APP" "$TMP_VOL/"
          # Add Applications shortcut for drag-install UX
          ln -s /Applications "$TMP_VOL/Applications"
          hdiutil create -volname "Corona Simulator" \
            -srcfolder "$TMP_VOL" \
            -ov -format UDZO \
            "$DMG"
          rm -rf "$TMP_VOL"
          echo "DMG: $(ls -lh "$DMG")"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.config }}
          path: |
            platform/mac/build/${{ matrix.config }}/Corona Simulator.app
            platform/mac/build/${{ matrix.config }}/Corona-Simulator-${{ matrix.config }}.dmg

  iOS-templates:
    name: iOS Template Build (${{ matrix.target }})
    if: github.event_name != 'workflow_call'
    needs: build-bgfx-libs
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        target: [template, template-angle]
    env:
      TEMPLATE_TARGET: ${{ matrix.target }}
      TEMPLATE_PLATFORM: iphone
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download bgfx iOS device libs
        uses: actions/download-artifact@v4
        with:
          name: bgfx-libs-ios-device
          path: external/bgfx/.build/ios-arm64/bin
      - name: Download bgfx iOS simulator libs
        uses: actions/download-artifact@v4
        with:
          name: bgfx-libs-ios-simulator
          path: external/bgfx/.build/ios-simulator/bin
      - name: Set build env
        run: |
          {
            echo "BUILD_NUMBER=9999"
            echo "BUILD=2100.9999"
            echo "YEAR=2100"
            echo "MONTH=$(date +'%-m')"
            echo "DAY=$(date +'%-d')"
          } >> "$GITHUB_ENV"
      - name: Build iOS templates
        working-directory: ./platform/iphone
        run: |
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          ./build_templates.sh "$XCODE_SDK" "2100.9999"

  Android-NDK:
    name: Android NDK Compile Check
    if: github.event_name != 'workflow_call'
    needs: build-bgfx-libs
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download bgfx Android arm64 libs
        uses: actions/download-artifact@v4
        with:
          name: bgfx-libs-android-arm64
          path: external/bgfx/.build/android-arm64/bin
      - name: CMake configure and build
        continue-on-error: true
        working-directory: ./platform/android/ndk
        run: |
          echo "::warning::Android NDK Compile Check is intentional partial coverage. Linking 6 libs (lua/jnlua5.1/mpg123/OpenAL/almixer/cpufeatures) requires Gradle add_subdirectory injected by SDK parent. Daily Build covers full link."
          mkdir -p ci-build && cd ci-build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_HOME \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORONA_ROOT=${{ github.workspace }} \
            -DLuaIncludePath=${{ github.workspace }}/external/lua-5.1.3/src
          cmake --build . -j$(sysctl -n hw.ncpu)
